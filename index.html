<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Absensi Siswa</title>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script>
    emailjs.init({
        publicKey: "uoy83P-_q51cTDUma"
    });
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Arial,sans-serif;min-height:100vh;padding:18px;color:#172033;
  background:linear-gradient(135deg,#4f46e5,#06b6d4,#22c55e);
  background-size:300% 300%;animation:bg 12s ease infinite;
}
@keyframes bg{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.container{max-width:900px;margin:auto}
.hero{text-align:center;color:white;padding:20px 10px}
.hero h1{font-size:36px;text-shadow:0 4px 15px #0004}
.hero p{margin-top:8px;color:#e0f2fe}
.clock{
  background:#ffffff22;backdrop-filter:blur(15px);border:1px solid #ffffff44;
  color:white;text-align:center;border-radius:24px;padding:22px;margin-bottom:18px;
  box-shadow:0 15px 40px #0003
}
.date{font-size:18px}.time{font-size:44px;font-weight:800;margin:6px 0}.zone{color:#a5f3fc;font-weight:bold}
.card{
  background:#fffffff5;border-radius:24px;padding:24px;margin-bottom:18px;
  box-shadow:0 15px 40px #0003
}
h2{margin-bottom:18px}
input[type=text]{
  width:100%;padding:16px;border:2px solid #dbeafe;border-radius:14px;
  font-size:16px;outline:none;margin-bottom:16px
}
input[type=text]:focus{border-color:#6366f1}
.options{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.option input{display:none}
.option label{
  display:block;text-align:center;padding:17px 8px;border:2px solid #e5e7eb;
  border-radius:16px;cursor:pointer;font-weight:bold;transition:.2s
}
.option label:hover{transform:translateY(-3px)}
.option input:checked+label{color:white;border-color:transparent;transform:translateY(-3px);box-shadow:0 8px 20px #0002}
#hadir:checked+label{background:#22c55e}
#sakit:checked+label{background:#f59e0b}
#izin:checked+label{background:#3b82f6}
#alpa:checked+label{background:#ef4444}
.reset{background:#ef4444;color:white;margin-top:12px}
button{
  border:0;border-radius:14px;padding:15px;width:100%;font-size:16px;
  font-weight:bold;cursor:pointer;transition:.2s
}
.submit{background:linear-gradient(135deg,#6366f1,#06b6d4);color:white}
.submit:hover{transform:translateY(-2px);box-shadow:0 8px 20px #4f46e555}
.warning{display:none;background:#fee2e2;color:#b91c1c;padding:12px;border-radius:12px;margin-bottom:14px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}
.stat{color:white;text-align:center;padding:15px;border-radius:16px}
.stat:nth-child(1){background:#22c55e}.stat:nth-child(2){background:#f59e0b}.stat:nth-child(3){background:#3b82f6}.stat:nth-child(4){background:#ef4444}
.num{font-size:28px;font-weight:bold}.label{font-size:12px;margin-top:3px}
.student{
  display:flex;justify-content:space-between;align-items:center;
  padding:15px;background:#f8fafc;border-radius:15px;margin-bottom:10px;
  border-left:6px solid #6366f1;animation:show .25s ease
}
@keyframes show{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.info{display:flex;align-items:center;gap:12px}.number{
  width:36px;height:36px;border-radius:50%;background:#6366f1;color:white;
  display:flex;align-items:center;justify-content:center;font-weight:bold
}
.name{font-weight:bold}.sent{font-size:13px;color:#64748b;margin-top:3px}
.badge{font-weight:bold;padding:8px 10px;border-radius:10px;font-size:13px}
.empty{text-align:center;color:#64748b;padding:30px}
@media(max-width:650px){
  .hero h1{font-size:28px}.time{font-size:35px}.card{padding:18px}
  .options{grid-template-columns:repeat(2,1fr)}
  .stats{grid-template-columns:repeat(2,1fr)}
  .student{align-items:flex-start;gap:8px}
  .badge{font-size:11px}
}
</style>
</head>
<body>
<div class="container">
  <div class="hero">
    <h1>📚 ABSENSI SISWA</h1>
    <p>Catat kehadiran dengan cepat dan mudah</p>
  </div>

  <div class="clock">
    <div class="date" id="date">Memuat tanggal...</div>
    <div class="time" id="time">00:00:00</div>
    <div class="zone">🌏 WITA • UTC+8</div>
  </div>

  <div class="card">
    <h2>📝 Isi Absensi</h2>
    <div class="warning" id="warning"></div>

    <input id="name" type="text" maxlength="60" placeholder="Masukkan nama lengkap...">

    <div class="options">
      <div class="option">
        <input id="hadir" type="radio" name="status" value="Hadir">
        <label for="hadir">Hadir ✅</label>
      </div>
      <div class="option">
        <input id="sakit" type="radio" name="status" value="Sakit">
        <label for="sakit">Sakit 🤕</label>
      </div>
      <div class="option">
        <input id="izin" type="radio" name="status" value="Izin">
        <label for="izin">Izin 🙏</label>
      </div>
      <div class="option">
        <input id="alpa" type="radio" name="status" value="Alpa">
        <label for="alpa">Alpa ❌</label>
      </div>
    </div>

    <button class="submit" onclick="submitAttendance()">📤 KIRIM ABSENSI</button>
  </div>

  <div class="card">
    <h2>📊 Rekap Hari Ini</h2>
    <div class="stats">
      <div class="stat"><div class="num" id="hadirCount">0</div><div class="label">Hadir ✅</div></div>
      <div class="stat"><div class="num" id="sakitCount">0</div><div class="label">Sakit 🤕</div></div>
      <div class="stat"><div class="num" id="izinCount">0</div><div class="label">Izin 🙏</div></div>
      <div class="stat"><div class="num" id="alpaCount">0</div><div class="label">Alpa ❌</div></div>
    </div>

    <div id="list"></div>
    <button class="reset" onclick="requestReset()">🔐 Reset Absensi</button>
  </div>
</div>

<script>
const statusInfo={
  Hadir:{emoji:"✅",color:"#22c55e"},
  Sakit:{emoji:"🤕",color:"#f59e0b"},
  Izin:{emoji:"🙏",color:"#3b82f6"},
  Alpa:{emoji:"❌",color:"#ef4444"}
};

const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxDtjiWwUfxh8sdZb-kU-b59ElXsceWMo-nXnzLF6fzQJj7jXYMNThss8hVrAb-2uWjDQ/exec";

// --- Database bersama (JSONBin) agar rekap sama di semua HP ---
const BIN_ID = "6ab68638ffd5d160532e1a7f";
const MASTER_KEY = "$2a$10$WhtiFu6gY.OQ4Xh7L/wh7u390aMbyThK8S3t6HkDPeWGCFU99tUeC";
const API_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

let cache = { date: null, absensi: [] };

async function fetchRemote(){
  const res = await fetch(`${API_URL}/latest`, {
    headers: { "X-Master-Key": MASTER_KEY, "X-Bin-Meta": "false" }
  });
  if(!res.ok) throw new Error("fetch failed");
  const record = await res.json();
  if(record && record.date === dateKey() && Array.isArray(record.absensi)){
    cache = record;
  } else {
    cache = { date: dateKey(), absensi: [] };
  }
}

async function saveRemote(){
  const res = await fetch(API_URL, {
    method: "PUT",
    headers: { "Content-Type": "application/json", "X-Master-Key": MASTER_KEY },
    body: JSON.stringify(cache)
  });
  if(!res.ok) throw new Error("save failed");
}

function wita(){
  return new Date(new Date().toLocaleString("en-US",{timeZone:"Asia/Makassar"}));
}

function dateKey(){
  const d=wita();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}

function formatDate(d){
  return d.toLocaleDateString("id-ID",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
}

async function updateClock(){
  const d=wita();
  const h=String(d.getHours()).padStart(2,"0");
  const m=String(d.getMinutes()).padStart(2,"0");
  const s=String(d.getSeconds()).padStart(2,"0");
  const today=dateKey();

  document.getElementById("date").textContent=formatDate(d);
  document.getElementById("time").textContent=`${h}:${m}:${s}`;

  if(today!==lastDate){
    lastDate=today;
    render();
  }
}

function getData(){
  return cache.date===dateKey() ? cache.absensi : [];
}

function warning(msg){
  const el=document.getElementById("warning");
  el.textContent=msg;el.style.display="block";
}

async function submitAttendance(){
  const name=document.getElementById("name").value.trim();
  const selected=document.querySelector('input[name="status"]:checked');
  document.getElementById("warning").style.display="none";

  if(!name){warning("⚠️ Silakan masukkan nama terlebih dahulu.");return}
  if(!selected){warning("⚠️ Pilih status: Hadir, Sakit, Izin, atau Alpa.");return}

  try{ await fetchRemote(); }catch(e){ warning("⚠️ Gagal terhubung ke database. Cek koneksi internet."); return }

  const data=getData();
  if(data.some(x=>x.name.toLowerCase()===name.toLowerCase())){
    warning("⚠️ Nama tersebut sudah mengisi absensi hari ini.");return
  }

  const d=wita();
  const time=`${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}:${String(d.getSeconds()).padStart(2,"0")}`;

  data.push({name,status:selected.value,time});
  cache={date:dateKey(),absensi:data};
  try{ await saveRemote(); }catch(e){ data.pop(); warning("⚠️ Gagal menyimpan ke database. Coba lagi."); return }

  // Kirim data absensi ke Google Sheets melalui Apps Script
  fetch(GOOGLE_SCRIPT_URL, {
    method: "POST",
    headers: {
      "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8"
    },
    body:
      "nama=" + encodeURIComponent(name) +
      "&status=" + encodeURIComponent(selected.value)
  })
  .then(function(response) {
    console.log("GOOGLE SHEETS:", response.status);
  })
  .catch(function(error) {
    console.error("GOOGLE SHEETS GAGAL:", error);
  });

  // Kirim data absensi ke email melalui EmailJS
  emailjs.send(
    "service_el21xtu",
    "template_nain78f",
    {
      nama: name,
      status: selected.value,
      waktu: time + " WITA"
    }
  )
  .then(function(response) {
    console.log("EMAIL BERHASIL:", response.status, response.text);

    document.getElementById("name").value="";
    document.querySelectorAll('input[name="status"]').forEach(x=>x.checked=false);
    render();

    alert(`✅ Absensi dan email berhasil dikirim!\n\nNama: ${name}\nStatus: ${selected.value}\nWaktu: ${time} WITA`);
  })
  .catch(function(error) {
    console.error("EMAIL GAGAL:", error);

    alert(
      "❌ Absensi tersimpan di website, tetapi email GAGAL dikirim.\n\n" +
      "Error: " + JSON.stringify(error)
    );

    render();
  });
}

function safe(text){
  const d=document.createElement("div");d.textContent=text;return d.innerHTML;
}

function render(){
  const data=getData();
  const counts={Hadir:0,Sakit:0,Izin:0,Alpa:0};
  data.forEach(x=>counts[x.status]++);

  document.getElementById("hadirCount").textContent=counts.Hadir;
  document.getElementById("sakitCount").textContent=counts.Sakit;
  document.getElementById("izinCount").textContent=counts.Izin;
  document.getElementById("alpaCount").textContent=counts.Alpa;

  const list=document.getElementById("list");
  if(!data.length){
    list.innerHTML='<div class="empty">📭 Belum ada absensi hari ini.</div>';
    return;
  }

  list.innerHTML="";
  data.forEach((x,i)=>{
    const info=statusInfo[x.status];
    const el=document.createElement("div");
    el.className="student";
    el.style.borderLeftColor=info.color;
    el.innerHTML=`
      <div class="info">
        <div class="number">${i+1}</div>
        <div>
          <div class="name">${safe(x.name)}</div>
          <div class="sent">🕐 ${x.time} WITA</div>
        </div>
      </div>
      <div class="badge" style="background:${info.color}22;color:${info.color}">
        ${info.emoji} ${x.status}
      </div>`;
    list.appendChild(el);
  });
}




// PIN admin saat ini: 739164  (ubah PIN dengan membuat hash SHA-256 baru jika diperlukan)
const RESET_PIN_HASH = "0864f7d7e73de9fea449e594a1ebf95ac3da44a16ce5aa4ac98acb97e5f985d6";

async function requestReset(){
  const pin = prompt("🔐 RESET ABSENSI\n\nMasukkan PIN admin:");
  if(pin === null) return;

  const hash = Array.from(new Uint8Array(
    await crypto.subtle.digest("SHA-256", new TextEncoder().encode(pin))
  )).map(b=>b.toString(16).padStart(2,"0")).join("");

  if(hash !== RESET_PIN_HASH){
    alert("❌ PIN salah. Absensi tidak di-reset.");
    return;
  }

  if(!confirm("⚠️ Yakin ingin menghapus SEMUA absensi hari ini?")) return;

  try{
    cache={date:dateKey(),absensi:[]};
    await saveRemote();

    // Pastikan database sudah berisi data kosong.
    await fetchRemote();
    cache={date:dateKey(),absensi:[]};
    render();

    alert("✅ Semua absensi hari ini berhasil dihapus dari JSONBin.");
  }catch(e){
    alert("❌ Reset gagal. Data database tidak diubah.");
  }
}

document.getElementById("name").addEventListener("keydown",e=>{
  if(e.key==="Enter")submitAttendance();
});

let lastDate=dateKey();
updateClock();

async function initialLoad(){
  try{ await fetchRemote(); }catch(e){ warning("⚠️ Gagal memuat data dari database."); }
  render();
}
initialLoad();
setInterval(()=>{ updateClock(); },1000);
setInterval(async ()=>{ try{ await fetchRemote(); render(); }catch(e){} },15000);
</script>
</body>
</html>
